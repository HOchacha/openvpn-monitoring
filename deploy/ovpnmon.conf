# ovpnmon configuration.
#
# Keys are the flag names from `ovpnmon -help`, so anything documented there
# can be set here. Command-line flags override this file; this file overrides
# the built-in defaults. An unknown key is a startup error rather than a silent
# no-op, so a typo cannot leave a setting quietly unapplied.
#
# Restart to apply changes: systemctl restart ovpnmon

# --- what to watch -----------------------------------------------------------

# The tun interface the eBPF probe attaches to.
iface = tun0

# The VPN client subnet, in CIDR form. Traffic from these addresses is what
# gets attributed to users.
subnet = 10.8.0.0/24

# OpenVPN management interface. This is where client identities come from.
# Note that OpenVPN accepts only one management client at a time.
mgmt = 127.0.0.1:7505

# Only when OpenVPN was started as "management <host> <port> <pwfile>".
# Point this at the same file; ovpnmon reads it rather than taking the
# password inline, so it stays out of process listings and out of this file.
# mgmt-password-file = /etc/openvpn/mgmt-password

# --- where to serve ----------------------------------------------------------

# Dashboard, JSON API and Prometheus metrics.
#
# Keep this on the loopback address unless there is authentication in front of
# it: these endpoints expose every user's browsing destinations.
listen = 127.0.0.1:9095

# --- history -----------------------------------------------------------------

# Durable session and destination history.
#   sqlite:<path>        a single file, no external dependency
#   mysql://<dsn>        e.g. mysql://user:pass@tcp(127.0.0.1:3306)/ovpnmon
#
# Comment this out to keep everything in memory, where it disappears on
# restart. Turning it on starts an irreversible record of who went where.
store = sqlite:/opt/ovpnmon/data/history.db

# How long history is kept. 0 keeps it forever.
retention = 720h

# --- authentication ----------------------------------------------------------

# Without a password hash the dashboard and API are open to anyone who can
# reach the listen address, and they expose every user's browsing history.
# Generate a hash with:
#
#   ovpnmon -hash-password '<password>'
#
# auth-user = admin
# auth-password-hash = $2a$10$...
# auth-session-ttl = 12h

# Prometheus has no browser session. Give it a token so /metrics keeps
# working once a password is set; deploy/observability/install.sh copies this
# value into Prometheus' scrape config.
#
# metrics-token = <long random string>

# --- temporary blocking ------------------------------------------------------

# Where OpenVPN's client-config-dir is. ovpnmon writes a file containing
# "disable" there to bar a user from connecting, and removes it when the block
# expires - no OpenVPN restart either way.
#
# Auto-detected from server-conf when left empty. Blocking also needs history
# enabled above, because the expiry lives in the database, not in the file.
#
# This is not revocation: the certificate stays valid and the block lifts by
# itself. Revoke instead if a key is compromised.
#
# ccd-dir = /etc/openvpn/ccd

# How often expired blocks are lifted. This is how late a block can end.
# block-check = 15s

# --- geoip -------------------------------------------------------------------

# Optional. Point this at a MaxMind GeoLite2 database and public destinations
# gain a country (and, with the City edition, a city) on the dashboard. The
# lookup is fully offline: the file is read locally and no address is ever sent
# to a third party. Without it, destinations are shown exactly as observed.
#
# Download GeoLite2-City.mmdb (or GeoLite2-Country.mmdb) from MaxMind with a
# free account; ovpnmon never fetches it for you.
#
# geoip-db = /var/lib/ovpnmon/GeoLite2-City.mmdb

# --- tuning ------------------------------------------------------------------

# Per-client destinations exposed as Prometheus series. The rest are summed
# into hostname="other". 0 disables per-destination metrics entirely.
top-destinations = 20

# Drop a flow from the kernel map after this much silence. Only affects the
# live view; history keeps what was already recorded.
flow-idle = 5m

# How long a resolved destination name stays valid.
name-ttl = 30m

# How often to poll the management interface for the session list.
poll = 1s

# debug, info, warn or error.
log-level = info
