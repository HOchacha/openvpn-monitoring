# Prometheus and Grafana deployment settings.
#
# Applied by `make observability`. Edit this file rather than passing
# environment variables, so the deployment is reproducible from the repository.

# Address the three services listen on.
#
# Loopback is the default because these endpoints hand out every VPN user's
# browsing destinations. ovpnmon and Prometheus have no authentication at all,
# so anything else needs a firewall or a reverse proxy in front, and Grafana's
# admin password must not still be the default.
bind_addr = 0.0.0.0

# ovpnmon's dashboard, API and /metrics. Written into ovpnmon.conf.
ovpnmon_port = 9095

# Prometheus. Change it if something else already holds 9090 on this host.
prometheus_port = 9091

# Grafana.
grafana_port = 3000
